name: KING Windows build

on:
  push:
    branches: [main, king]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Fetch ddnet-libs if missing
      shell: bash
      run: |
        if [ ! -d ddnet-libs/sdl ]; then
          rm -rf ddnet-libs
          git clone --depth 1 https://github.com/ddnet/ddnet-libs ddnet-libs
        fi

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
        cache-bin: false

    - name: Configure
      run: |
        mkdir release
        cd release
        cmake -A x64 -DEXCEPTION_HANDLING=ON -DVULKAN=ON -DCMAKE_BUILD_TYPE=Release -DSERVER=OFF -DTOOLS=OFF -DDISCORD=OFF -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..

    - name: Build
      run: |
        cd release
        cmake --build . --config Release --target game-client

    - name: Package
      run: |
        cd release
        cmake --build . --config Release --target package_default
        mkdir artifacts
        mv *-win64.zip artifacts

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KING-win64
        path: release/artifacts/*.zip

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release/artifacts/*.zip
