name: KING Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Fetch ddnet-libs if missing
      shell: bash
      run: |
        if [ ! -d ddnet-libs/sdl ]; then
          rm -rf ddnet-libs
          git clone --depth 1 https://github.com/ddnet/ddnet-libs ddnet-libs
        fi

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
        cache-bin: false

    - name: Configure
      run: |
        mkdir release
        cd release
        cmake -E env CXXFLAGS=/DKING_REQUIRE_WINRT cmake -A x64 -DEXCEPTION_HANDLING=ON -DVULKAN=ON -DCMAKE_BUILD_TYPE=Release -DTOOLS=OFF -DDISCORD=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..

    - name: Build
      shell: pwsh
      run: |
        cd release
        cmake --build . --config Release --target game-client game-server 2>&1 | Tee-Object -FilePath build.log
        if ($LASTEXITCODE -ne 0) {
          # show compiler errors as annotations (readable without the full log)
          Select-String -Path build.log -Pattern 'error C\d+|error LNK\d+|fatal error|: error ' | Select-Object -First 40 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
          exit 1
        }
        Select-String -Path build.log -Pattern 'KING: ' | Select-Object -First 5 | ForEach-Object { Write-Output ("::notice::" + $_.Line.Trim()) }

    - name: Package
      run: |
        cd release
        cmake --build . --config Release --target package_default
        mkdir artifacts
        mv *-win64.zip artifacts

    - name: Check release package
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = (Get-ChildItem release/artifacts/*-win64.zip | Select-Object -First 1).FullName
        $names = [IO.Compression.ZipFile]::OpenRead($zip).Entries | ForEach-Object { $_.FullName -replace '^[^/]+/', '' }
        foreach ($need in 'KING.exe', 'KING-Server.exe', 'data/tclient/king_crown.png') {
          if ($names -notcontains $need) { throw "$need missing from the package" }
        }
        # the in-client updater (king_install.cpp) does not support these
        if ([IO.Compression.ZipFile]::OpenRead($zip).Entries | Where-Object { $_.FullName -match '\.\.' }) { throw 'unsafe path in package' }
        Write-Host "package OK: $($names.Count) entries"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KING-win64
        path: release/artifacts/*.zip

    - name: Read KING version
      id: ver
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VER=$(sed -n 's/^#define KING_VERSION "\(.*\)"/\1/p' src/game/version.h)
        echo "version=$VER" >> "$GITHUB_OUTPUT"
        if gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "exists=1" >> "$GITHUB_OUTPUT"
        else
          echo "exists=0" >> "$GITHUB_OUTPUT"
        fi

    # A push to main with a new KING_VERSION creates release vX.Y.Z automatically.
    # Clients on older versions then see the update notice.
    - name: Publish release (new version on main)
      if: github.ref == 'refs/heads/main' && steps.ver.outputs.exists == '0'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VER="${{ steps.ver.outputs.version }}"
        gh release create "v$VER" release/artifacts/*.zip -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KING $VER" --notes "KING $VER. Скачай KING-…-win64.zip, распакуй и запусти KING.exe."

    - name: Publish release (tag push)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release/artifacts/*.zip
